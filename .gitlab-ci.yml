# This file is auto-generated by DevPlatform for further customizing as you wish.
# NOTE: You should not delete this file!
include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/spirit.yaml
      - /jobs/build.yaml
      - /jobs/rules.yaml

stages:
  - build
  - deploy

# Секреты (SPIRIT_DOCKER_SA_KEY, DEPLOY_KEY) задаются в Spirit, а не в GitLab-e:
# Код → Репозитории → ваш репозиторий → вкладка CI-переменные.
# Переменная репозитория приоритетнее значения в этом файле, поэтому всё,
# что задано ниже, можно переопределить из Spirit без правки файла.
variables:
  # Адрес Docker Registry Spirit. Без него Kaniko пушит в Docker Hub и получает 401
  DOCKER_ARTIFACTORY_REGISTRY: registry.spirit.t-education.com
  # Имя образа в Spirit Registry: registry.spirit.t-education.com/<тенант>/<репозиторий>:<sha>
  IMAGE_NAME: ${DOCKER_ARTIFACTORY_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
  # Публичный адрес ВМ. Впишите свой сюда или создайте переменную DEPLOY_HOST
  # в Spirit (переменная репозитория приоритетнее этого значения)
  DEPLOY_HOST: ${DEPLOY_HOST}
  # Пользователь на ВМ. По умолчанию root; чтобы сменить, создайте
  # переменную DEPLOY_USER в Spirit (CI-переменные репозитория) — она приоритетнее этого значения
  DEPLOY_USER: root
  # Образ для deploy-джобы: любой, где есть dp CLI (нужен для авторизации в registry) и ssh
  DEPLOY_IMG: registry.spirit.t-education.com/cicd-images/base-noble:release-1.1.0

# 1. Сборка образа через Kaniko и публикация в registry
build:image:
  extends:
    - .dp_build

# Общие настройки SSH для джоб, которые ходят на ВМ
.ssh_vm:
  image: $DEPLOY_IMG
  variables:
    SSH: "ssh -i $DEPLOY_KEY -o StrictHostKeyChecking=accept-new"
    SCP: "scp -i $DEPLOY_KEY -o StrictHostKeyChecking=accept-new"
    VM: "$DEPLOY_USER@$DEPLOY_HOST"
    DP_CLI_VERSION: "14.1.3"
  before_script:
    - |
      if [ "$DEPLOY_HOST" = "CHANGE_ME_VM_IP" ]; then
        echo "Укажите адрес ВМ: переменная DEPLOY_HOST в .gitlab-ci.yml или в CI-переменных репозитория в Spirit"; exit 1
      fi
    # в образе может не быть ssh/scp — доустанавливаем (нужен root в образе)
    - command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client)
    - chmod 600 $DEPLOY_KEY

# 2. Подготовка ВМ: ставим Spirit CLI (dp), если его ещё нет
setup:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  script:
    - |
      $SSH $VM "command -v dp >/dev/null || (
        curl -fL https://spirit.t-education.com/static/cli/tedu/$DP_CLI_VERSION/linux/dp -o /tmp/dp &&
        chmod +x /tmp/dp && sudo mv /tmp/dp /usr/local/bin/dp )"

# 3. Деплой на VM по SSH (только master)
deploy:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  needs: ["build:image", "setup:vm"]
  resource_group: production
  script:
    # кладём на ВМ compose-файл и ключ сервис-аккаунта
    - $SSH $VM "mkdir -p ~/app"
    - $SCP ./docker-compose.yml $SPIRIT_DOCKER_SA_KEY $VM:app/
    # .env не хранится в git — берём его из CI-переменной APP_ENV_FILE (тип File) в Spirit
    - |
      if [ -z "$APP_ENV_FILE" ] || [ ! -f "$APP_ENV_FILE" ]; then
        echo "Создайте CI-переменную APP_ENV_FILE (тип File) с содержимым .env"; exit 1
      fi
    - $SCP $APP_ENV_FILE $VM:app/.env
    # на ВМ: входим в registry, скачиваем новый образ и перезапускаем.
    # dp и docker запускаем через sudo: dp пишет helper в /usr/local/bin, это требует root
    - |
      $SSH $VM "cd ~/app &&
        sudo dp auth service-acc --key-file $(basename $SPIRIT_DOCKER_SA_KEY) &&
        sudo dp auth configure-docker &&
        sudo IMAGE_NAME=$IMAGE_NAME docker compose pull &&
        sudo IMAGE_NAME=$IMAGE_NAME docker compose up -d"
  environment:
    name: production
