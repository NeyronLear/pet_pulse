name: CI-CD main Pipeline

env:
  REGISTRY: ghcr.io
  # Формируем корректный динамический путь к образу для использования во всех джобах
  IMAGE_NAME: ghcr.io/${{ github.repository }}:latest

on:
  push:
    branches: ["feature/*", "fix/*", "main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          
      - name: Run Django tests
        run: |
          cd main_app
          pytest

  build-and-verify:
    runs-on: ubuntu-latest
    needs: test-and-lint
    # Пропускаем этот тяжелый шаг для обычных feature-веток (пока они не мержутся)
    if: github.ref_name == 'develop' || github.ref_name == 'main' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lower case owner and repository name
        run: |
          IMAGE_RAW="ghcr.io/${{ github.repository }}:latest"
          IMAGE_LC=$(echo "$IMAGE_RAW" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_LC" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      # Пушим образ только при реальном пуше (мерже) в develop или main. 
      # При проверке Pull Request пушить образ не нужно.
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lower case owner and repository name
        run: |
          IMAGE_RAW="ghcr.io/${{ github.repository }}:latest"
          IMAGE_LC=$(echo "$IMAGE_RAW" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_LC" >> $GITHUB_ENV

      - name: Deploy to Production Server via SSH
        run: |
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
          ssh-add -l
          mkdir -p ~/.ssh && echo "StrictHostKeyChecking no" >> ~/.ssh/config
          
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}"
          
          # 1. Подготовка структуры папок на удаленной ВМ
          ssh $SERVER "mkdir -p ~/app/nginx"
          
          # 2. Копирование необходимых конфигурационных файлов, шаблонов Nginx и скриптов SSL
          scp ./docker-compose.yml $SERVER:~/app/docker-compose.yml
          scp ./scripts/setup_ssl.sh $SERVER:~/app/setup_ssl.sh
          scp -r ./nginx/ $SERVER:~/app/
          
          # 3. Полный цикл развертывания, генерации SSL и настройки крона
          ssh $SERVER "
            cd ~/app &&
            
            # Дописываем доменные имена в .env на сервере, беря значение из секретов GitHub
            # Если домен еще не привязан к серверу, используйте IP сервера в секрете DOMAIN
            sudo sed -i '/^DOMAIN=/d;/^FQDN=/d' .env 2>/dev/null || true
            printf '\nDOMAIN=%s\nFQDN=%s\n' '${{ secrets.DOMAIN }}' '${{ secrets.DOMAIN }}' >> .env
            
            # Запуск скрипта генерации SSL-сертификатов Let's Encrypt (из оригинального пайплайна)
            sudo sh setup_ssl.sh '${{ secrets.DOMAIN }}' '${{ secrets.LE_EMAIL }}' ~/app
            
            # Авторизация сервера в GitHub реестре
            echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Загрузка нового образа, перезапуск контейнеров и чистка мусора
            sudo IMAGE_NAME=${{ env.IMAGE_NAME }} docker compose pull
            sudo IMAGE_NAME=${{ env.IMAGE_NAME }} docker compose up -d --remove-orphans
            sudo DJANGO_SUPERUSER_USERNAME=${{ secrets.SUPERUSER_USERNAME }} \
                 DJANGO_SUPERUSER_EMAIL=${{ secrets.SUPERUSER_EMAIL }} \
                 DJANGO_SUPERUSER_PASSWORD=${{ secrets.SUPERUSER_PASSWORD }} \
                 docker compose exec -T server sh -c '\
                   python manage.py shell -c "
            from django.contrib.auth import get_user_model
            U = get_user_model()
            u, created = U.objects.get_or_create(
                username=\"$DJANGO_SUPERUSER_USERNAME\",
                defaults={\"email\": \"$DJANGO_SUPERUSER_EMAIL\"})
            u.set_password(\"$DJANGO_SUPERUSER_PASSWORD\")
            u.is_staff = u.is_superuser = True
            u.save()
            print(\"superuser ok\")"'
            sudo docker image prune -f
            
            # Восстановление Крон-задачи для рассылки напоминаний Django (каждый день в 06:00 UTC)
            (sudo crontab -l 2>/dev/null | grep -v send_reminders;
            echo \"0 6 * * * cd \$HOME/app && sudo docker compose exec -T server python manage.py send_reminders >> /var/log/petpulse-reminders.log 2>&1\") | sudo crontab -
          "
