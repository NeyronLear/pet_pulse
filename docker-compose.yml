services:
  server:
    environment:
      DB_PATH: /data/db.sqlite3

    # в CI/на ВМ используется готовый образ из registry; локально — собирается из исходников
    image: ${IMAGE_NAME:-pet_pulse_1337:local}

    expose:
      - "8000"

    env_file:
      - .env

    volumes:
      - static:/app/main_app/staticfiles
      - db:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/user/test', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
    depends_on:
      server:
        condition: service_healthy
  
volumes:
  static:
  db: